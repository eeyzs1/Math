name: Verify offline course
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests
      - run: python tools/build_all.py
      - name: Check generated files are committed
        run: python -c "import subprocess; changes=subprocess.check_output(['git','status','--porcelain'],text=True); print(changes,end=''); raise SystemExit(bool(changes))"
      - run: python tools/verify_course.py
